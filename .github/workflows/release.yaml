name: Publish Release Assets

# 改为手动触发
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------
  # 构建作业：现在只负责编译和保存构件
  # ----------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use nightly toolchain
        run: rustup update nightly && rustup default nightly
      - name: Build
        run: cargo build --release
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'target/release/raphael-xiv'
      # 不再上传到 release，而是作为工作流构件保存
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphael_x86_64_linux
          path: target/release/raphael-xiv

  linux-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use nightly toolchain
        run: rustup update nightly && rustup default nightly
      - name: Build
        run: cargo build --release --package raphael-cli
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'target/release/raphael-cli'
      # 不再上传到 release，而是作为工作流构件保存
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphael-cli_x86_64_linux
          path: target/release/raphael-cli

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use nightly toolchain
        run: rustup update nightly && rustup default nightly
      - name: Build
        run: cargo build --release
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'target/release/raphael-xiv.exe'
      # 不再上传到 release，而是作为工作流构件保存
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphael_x86_64_windows.exe
          path: target/release/raphael-xiv.exe

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use nightly toolchain
        run: rustup update nightly && rustup default nightly
      - name: Build
        run: cargo build --release --package raphael-cli
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'target/release/raphael-cli.exe'
      # 不再上传到 release，而是作为工作流构件保存
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raphael-cli_x86_64_windows.exe
          path: target/release/raphael-cli.exe

  # ----------------------------------------------------
  # 发布作业：等待所有构建完成后，创建 Release 并上传所有文件
  # ----------------------------------------------------
  publish:
    runs-on: ubuntu-latest
    # 'needs'确保此作业在所有构建作业成功后才运行
    needs: [linux, linux-cli, windows, windows-cli]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # 将所有构件下载到 'dist' 目录
          path: dist

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # 自动生成基于日期的 tag, 例如 release-2024-06-25-16-11-20
          tag_name: "release-${{ github.run_id }}-${{ github.run_number }}"
          # 自动生成 Release Notes
          generate_release_notes: true
          # 将 'dist' 目录下的所有文件都上传
          files: |
            dist/**/*
